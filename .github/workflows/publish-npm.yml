#
# Publishes @tyroneross/interface-built-right to the PUBLIC npm registry
# (registry.npmjs.org) via OIDC Trusted Publishing — NO long-lived token is
# stored or required. The publish command passes `--provenance` so npm emits a
# signed provenance attestation.
#
# This runs ALONGSIDE `publish-github-packages.yml`, which publishes the same
# version to GitHub Packages. Both fire on a published GitHub Release. They are
# independent; one failing does not block the other.
#
# ─── ONE-TIME MANUAL PREREQUISITES (cannot be automated — do these once) ──────
# OIDC trusted publishing can only publish UPDATES to a package that already
# exists on npmjs, and only after a trusted publisher is registered. Until both
# are done, this workflow will fail. See docs/PUBLISHING.md for the walkthrough.
#
#   1. Bootstrap-publish v1 manually, from a machine logged into npm
#      (`npm login`), because OIDC cannot create a brand-new package:
#         npm publish --access public --registry https://registry.npmjs.org
#
#   2. On npmjs.com → the package page → Settings → Trusted Publisher, add:
#         Provider:    GitHub Actions
#         Owner/repo:  tyroneross/interface-built-right
#         Workflow:    publish-npm.yml
#         Environment: (leave blank — none is configured below)
#
# After that, every published Release runs this workflow with no secret.
# `package.json#repository.url` already matches the repo, which provenance
# verification requires.
# ─────────────────────────────────────────────────────────────────────────────
name: Publish to npmjs (OIDC Trusted Publishing)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run 'npm publish --dry-run' instead of publishing"
        required: false
        default: "true"

permissions:
  contents: read
  id-token: write # REQUIRED for OIDC trusted publishing — do NOT remove

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Node 24 bundles npm >= 11.5.1, the minimum for OIDC trusted publishing.
      # registry-url points the publish at npmjs; do NOT set always-auth/scope —
      # OIDC handles auth, and a stored token would DISABLE trusted publishing.
      # package-manager-cache is disabled for release builds per npm guidance.
      - name: Setup Node (npmjs registry)
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Assert npm >= 11.5.1 (OIDC requirement)
        run: |
          # Upgrade defensively in case the bundled npm ever lags the requirement.
          npm install -g npm@latest
          NPM_V="$(npm --version)"
          echo "npm $NPM_V"
          MAJOR="${NPM_V%%.*}"
          if [ "$MAJOR" -lt 11 ]; then
            echo "::error::npm $NPM_V is below 11.5.1 required for OIDC trusted publishing"
            exit 1
          fi

      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG)"
            exit 1
          fi
          echo "Version match: package.json=$PKG_VERSION tag=$TAG"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run test suite
        # UNIT-ONLY, matching ci.yml's ubuntu job. The browser-integration and
        # macOS-native tests are gated by ci.yml's `integration + native
        # (macos-14)` job — they cannot pass here, because this runner is
        # ubuntu and `scanObsidian — live Chrome` needs a real Obsidian install.
        #
        # This is not a weakened gate: without IBR_UNIT_ONLY this step silently
        # duplicated the macOS job on the wrong OS. It passed until 2026-07-17,
        # when `src/obsidian/obsidian.integration.test.ts` landed (1c43a5b) and
        # made the duplication fatal — which is why v1.4.0 published on
        # 2026-06-08 and v1.5.0 could not.
        env:
          IBR_UNIT_ONLY: "1"
        run: npm test -- --run

      - name: Validate release surfaces and package exports
        run: npm run validate:release

      # Turn a masked publish failure into a named cause. npm's OIDC helper
      # swallows every exchange failure at log.verbose/silly and returns
      # undefined (npm 11.19.0, lib/utils/oidc.js), so a broken trusted-publisher
      # binding is invisible at the default loglevel: the publish then goes out
      # with setup-node's placeholder NODE_AUTH_TOKEN and npmjs answers
      # `E404 Not Found - PUT`, which reads like a missing package and is not.
      # This step makes the same two calls npm makes and prints what npmjs
      # actually answered, plus the exact claims the binding is matched against.
      # Diagnostic only: never publishes, never prints either token.
      # Source of truth: references/npm-package-publishing.md (build-loop).
      - name: Diagnose npm trusted-publisher binding
        continue-on-error: true
        env:
          NPM_PACKAGE: '@tyroneross/interface-built-right'
        run: |
          set -uo pipefail
          ID_TOKEN=$(curl -sS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write((JSON.parse(d).value)||''))")
          if [ -z "${ID_TOKEN}" ]; then
            echo "No GitHub OIDC id-token issued. Check that the job grants permissions.id-token: write."
            exit 0
          fi
          echo "Claims npmjs matches the trusted publisher against:"
          ID_TOKEN="${ID_TOKEN}" node -e '
            const p = JSON.parse(Buffer.from(process.env.ID_TOKEN.split(".")[1], "base64url").toString("utf8"));
            for (const k of ["repository", "repository_owner", "repository_visibility", "workflow_ref", "job_workflow_ref", "ref", "event_name"]) {
              console.log(`  ${k} = ${p[k]}`);
            }
          '
          # npm escapes the scope separator only, and lowercases the escape
          # (npm-package-arg escapedName): @scope%2fname, not %40scope%2Fname.
          ESCAPED="${NPM_PACKAGE/\//%2f}"
          echo "POST /-/npm/v1/oidc/token/exchange/package/${ESCAPED}"
          STATUS=$(curl -sS -o /tmp/npm-oidc-exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${ESCAPED}")
          echo "  HTTP ${STATUS}"
          if [ "${STATUS}" = "200" ]; then
            echo "  Exchange succeeded. The trusted-publisher binding is valid. (Token withheld from the log.)"
          else
            echo "  npmjs rejected the exchange. Response body:"
            sed -e 's/^/    /' /tmp/npm-oidc-exchange.json
            echo "  Fix at npmjs.com > @tyroneross/interface-built-right > Settings > Trusted Publisher."
            echo "  Every field is case-sensitive and unvalidated; match the claims printed above."
          fi

      # `--registry` is REQUIRED here: package.json#publishConfig.registry points
      # at GitHub Packages, and would otherwise hijack this publish. The CLI flag
      # overrides publishConfig. `--access public` is required for the scoped
      # @tyroneross package. `--provenance` makes the attestation requirement
      # explicit. No NODE_AUTH_TOKEN — OIDC authenticates via the id-token
      # permission, so no npm secret is stored.
      - name: Publish to npmjs (dry-run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: npm publish --dry-run --provenance --access public --registry https://registry.npmjs.org

      - name: Publish to npmjs (OIDC, provenance)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        run: npm publish --provenance --access public --registry https://registry.npmjs.org
