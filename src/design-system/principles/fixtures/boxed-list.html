<!doctype html>
<!-- TRUE violation for calm-precision/gestalt-grouping: every list item is
     individually boxed with a four-sided border. -->
<html lang="en"><head><meta charset="utf-8"><title>Boxed list</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #111827; }
  main { padding: 24px; }
  ul { list-style: none; padding: 0; }
  li { border: 1px solid #d1d5db; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
</style></head>
<body><main>
  <ul id="boxed">
    <li id="boxed-1">First boxed item</li>
    <li id="boxed-2">Second boxed item</li>
    <li id="boxed-3">Third boxed item</li>
  </ul>
</main></body></html>
